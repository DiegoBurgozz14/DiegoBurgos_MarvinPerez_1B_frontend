</head>

<body class="bg-light">
        <header>
    <nav class="navbar navbar-expand-lg bg-body-beige">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Eventos Prestige</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">

          <a class="nav-link active"  href="index.html">Inicio</a>

</nav>
</header>

<main class="container py-5">

        <section class="text-center mb-5">
            <h1 class="fw-bold">Registrar clientes</h1>
            <p class="text-muted">
                Agregar, editar o eliminar clientes
            </p>
        </section>

        <section class="card shadow-sm mb-5">
            <div class="card-header bg-primary text-white">
                <h2 class="h5 mb-0">Agregar cliente</h2>
            </div>

            <div class="card-body">
                <!-- Formulario para agregar clientes -->
                <form id="formCliente">
                    <div class="form-group my-3">
                        <label for="txtNombre" class="form-label">Nombre</label>
                        <input type="text" id="txtName" class="form-control" required>
                    </div>

                    <div class="form-group my-3">
                        <label for="txtApellido" class="form-label">Apellido</label>
                        <input type="text" id="txtApellido" class="form-control" required>
                    </div>

                     <div class="form-group my-3">
                        <label for="txtTelefono" class="form-label">Teléfono</label>
                        <input type="text" id="txtTelefono" class="form-control" required>
                    </div>

                    <div class="form-group my-3">
                        <label for="txtEmail" class="form-label">Correo Electrónico</label>
                        <input type="email" id="txtEmail" class="form-control" required>
                    </div>

                     <div class="form-group my-3">
                        <label for="txtDireccion" class="form-label">Dirección</label>
                        <input type="text" id="txtDireccion" class="form-control" required>
                    </div>

                   

                    <button type="submit" id="btnGuardar" class="btn btn-primary">Guardar Registro</button>
                </form>
            </div>
        </section>


        <section class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h2 class="h5 mb-0">Lista de clientes</h2>
            </div>

            <div class="card-body">

                <div id="mensaje" class="alert d-none" role="alert"></div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Teléfono</th>
                                <th>Email</th>
                                <th>Dirección</th>

                            </tr>
                        </thead>
                        <tbody id="tablaClientes">
                            <!-- Aquí se cargarán los clientes -->
                            <td colspan="6">Cargando...</td>
                        </tbody>
                    </table>
                </div>

            </div>
        </section>

</main>
    

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
